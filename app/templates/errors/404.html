{% extends "base.html" %}
{% block title %}404 · CREW{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="login-card glass-panel" style="max-width:620px;margin:auto;text-align:center;">
    <div class="auth-kicker">CREW</div>
    <h1>That page wandered off.</h1>
    <p class="auth-subtitle">The CREW page you were looking for is not here.</p>
    <a class="primary-button" href="{{ url_for('main.home') if session.get('user') else url_for('auth.login') }}">Back to CREW</a>
  </section>
</main>
{% endblock %}
