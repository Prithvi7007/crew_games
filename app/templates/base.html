<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05080d">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}CREW{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css', v='13.10.1') }}">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v18-pages.css', v='18.1.0') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v19-game-results.css', v='19.3.0') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>
    <div class="noise"></div>

    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='js/ui.js', v='13.3') }}"></script>
    <script src="{{ url_for('static', filename='js/game-results.js', v='19.3.0') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
