# Defense-in-depth request throttling. Application-level failed-attempt limits remain authoritative.
limit_req_zone $binary_remote_addr zone=crew_auth_edge:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=crew_admin_edge:10m rate=10r/m;

# Example CREW Nginx site. Adjust the hostname/certificate paths if the domain changes.
upstream crew_app {
    server unix:/run/crew/crew.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name cadacrew.fun www.cadacrew.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://cadacrew.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cadacrew.fun;

    ssl_certificate /etc/letsencrypt/live/cadacrew.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cadacrew.fun/privkey.pem;
    return 301 https://cadacrew.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cadacrew.fun;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cadacrew.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cadacrew.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    limit_req_status 429;

    location ~ ^/(login|create-profile|recover)$ {
        limit_req zone=crew_auth_edge burst=12 nodelay;
        proxy_pass http://crew_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }

    location = /admin/login {
        limit_req zone=crew_admin_edge burst=5 nodelay;
        proxy_pass http://crew_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }

    location /static/ {
        alias /opt/crew/app/static/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        access_log off;
        proxy_pass http://crew_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://crew_app;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
