# CREW is isolated by hostname and a private Unix socket.\n# Replace crew.example.com before enabling this file.\n\nlimit_req_zone $binary_remote_addr zone=crew_auth:10m rate=10r/m;\n\nserver {\n    listen 80;\n    listen [::]:80;\n    server_name crew.example.com;\n\n    client_max_body_size 2m;\n\n    location /static/ {\n        alias /opt/crew/app/static/;\n        access_log off;\n        expires 1d;\n        add_header Cache-Control "public, max-age=86400";\n    }\n\n    location ~ ^/(login|create-profile|recover|admin/login)$ {\n        limit_req zone=crew_auth burst=10 nodelay;\n        include proxy_params;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_pass http://unix:/run/crew/crew.sock;\n    }\n\n    location / {\n        include proxy_params;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_pass http://unix:/run/crew/crew.sock;\n    }\n}\n