name: CREW quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Python tests
        run: pytest -q

      - name: Python syntax
        run: python -m compileall -q app tests alembic config.py run.py

      - name: Critical Python lint
        run: ruff check app tests alembic --select E9,F63,F7,F82

      - name: JavaScript syntax
        run: find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Shell syntax
        run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:////tmp/crew-ci.db
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade v11_baseline
          alembic -c alembic.ini upgrade head

      - name: Dependency audit
        run: pip-audit -r requirements.txt
